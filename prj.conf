# DECT NR+ PHY
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_MODEM_ANTENNA=n

# TF-M logging would claim UART1, which is the AT port here.
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# Peripherals
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CRC=y
CONFIG_REBOOT=y

# Debug log on UART0 (TX_DBG, J1-71)
CONFIG_LOG=y
CONFIG_FCC_LOG_LEVEL=3
CONFIG_UART_0_NRF_ASYNC_LOW_POWER=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048
